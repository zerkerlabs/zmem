name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Superseded runs on a PR branch are cancelled, but main and release tags always
# run to completion so every landed commit and every release is smoke-tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  unit-and-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: zerker eval

  release-smoke:
    runs-on: ubuntu-latest
    needs: unit-and-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e .
      - run: bash examples/first_run.sh
      - run: python scripts/release_smoke.py

  activegraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[activegraph]'
      - run: activegraph pack list
      - run: python scripts/verify_activegraph_pack.py --summary-only
      - run: python examples/activegraph_host.py --db /tmp/zmem-activegraph-host.sqlite --summary-only
      - run: python -m unittest tests.test_activegraph_pack

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run lint
        working-directory: site
      - run: npm run build
        working-directory: site

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run typecheck
        working-directory: docs
      - run: npm run build
        working-directory: docs
